"on":
  push:
    branches: [main]

name: Test and Deploy

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm test

  migrate:
    name: Database migration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Push schema
        run: npx prisma db push --config src/config/prisma.config.ts --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
