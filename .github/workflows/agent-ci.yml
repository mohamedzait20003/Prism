name: Validate Agent

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gitagent
        run: npm install -g @open-gitagent/gitagent

      - name: Validate reviewer agent
        run: |
          test -f agent/agent.yaml
          test -f agent/SOUL.md
          test -f agent/RULES.md
          test -f agent/DUTIES.md
          test -f agent/AGENTS.md
          python3 -c "import yaml; yaml.safe_load(open('agent/agent.yaml'))"
          echo "reviewer agent: valid"

      - name: Validate meta-agent
        run: |
          test -f agent/agents/meta-agent/agent.yaml
          test -f agent/agents/meta-agent/SOUL.md
          test -f agent/agents/meta-agent/DUTIES.md
          python3 -c "import yaml; yaml.safe_load(open('agent/agents/meta-agent/agent.yaml'))"
          echo "meta-agent: valid"
